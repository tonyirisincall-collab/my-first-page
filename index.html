<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>متجر المنتج</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    /* ========== VARIABLES ========== */
    :root {
      --bg:        #0c0c0f;
      --surface:   #141418;
      --card:      #1c1c22;
      --border:    #2a2a35;
      --accent:    #f0a500;
      --accent2:   #ff6b35;
      --text:      #f0ede8;
      --muted:     #8a8799;
      --radius:    16px;
      --transition: .35s cubic-bezier(.4,0,.2,1);
    }

    /* ========== RESET ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== NOISE TEXTURE ========== */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* ========== LOADER ========== */
    #loader {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
      transition: opacity .5s, visibility .5s;
    }
    #loader.hidden { opacity: 0; visibility: hidden; }
    .loader-ring {
      width: 56px; height: 56px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .loader-text { color: var(--muted); font-size: .9rem; letter-spacing: .05em; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== LAYOUT ========== */
    .wrapper { position: relative; z-index: 1; }

    /* ========== HERO NAV ========== */
    header {
      padding: 24px 40px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 10;
      background: rgba(12,12,15,.85);
    }
    .logo {
      font-size: 1.3rem; font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -.02em;
    }
    .nav-badge {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 16px; border-radius: 99px;
      font-size: .8rem; color: var(--muted);
    }

    /* ========== HERO SECTION ========== */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
      padding: 80px 60px;
      min-height: calc(100vh - 73px);
    }
    @media(max-width:768px){
      .hero { grid-template-columns: 1fr; padding: 40px 24px; gap: 40px; }
      header { padding: 18px 24px; }
    }

    /* LEFT — IMAGE SIDE */
    .image-side { position: relative; }
    .image-frame {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      aspect-ratio: 1/1;
      display: flex; align-items: center; justify-content: center;
    }
    .image-frame::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 60%, rgba(240,165,0,.08));
      pointer-events: none;
    }
    #productImage {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform .6s ease;
    }
    .image-frame:hover #productImage { transform: scale(1.04); }

    .badge-float {
      position: absolute;
      top: 20px; left: 20px;
      background: var(--accent);
      color: #000;
      font-size: .75rem; font-weight: 800;
      padding: 6px 14px; border-radius: 99px;
      text-transform: uppercase; letter-spacing: .08em;
    }
    .rating-float {
      position: absolute;
      bottom: 20px; right: 20px;
      background: rgba(20,20,24,.9);
      border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 12px;
      display: flex; align-items: center; gap: 8px;
      font-size: .85rem; font-weight: 700;
      backdrop-filter: blur(6px);
    }
    .stars { color: var(--accent); letter-spacing: 2px; }

    /* RIGHT — INFO SIDE */
    .info-side { display: flex; flex-direction: column; gap: 28px; }
    .category-tag {
      display: inline-block;
      font-size: .75rem; font-weight: 700;
      color: var(--accent); text-transform: uppercase; letter-spacing: .12em;
      border: 1px solid rgba(240,165,0,.25);
      background: rgba(240,165,0,.06);
      padding: 5px 14px; border-radius: 99px;
      align-self: flex-start;
    }
    #productName {
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -.03em;
    }
    #productDesc {
      font-size: 1.05rem;
      color: var(--muted);
      line-height: 1.8;
    }

    /* PRICE BLOCK */
    .price-block {
      display: flex; align-items: baseline; gap: 12px;
      padding: 20px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    #productPrice {
      font-size: 2.4rem; font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .price-currency { font-size: 1rem; color: var(--muted); }
    .price-note { font-size: .8rem; color: var(--muted); margin-right: auto; }

    /* FEATURES */
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .feature-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: .85rem; color: var(--muted);
      transition: border-color var(--transition), color var(--transition);
    }
    .feature-item:hover { border-color: var(--accent); color: var(--text); }
    .feature-icon { font-size: 1.1rem; }

    /* CTA BUTTON */
    .cta-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%;
      padding: 18px 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      font-family: 'Cairo', sans-serif;
      font-size: 1.05rem; font-weight: 800;
      border: none; border-radius: var(--radius);
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
      letter-spacing: -.01em;
    }
    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(240,165,0,.35);
    }
    .cta-btn:active { transform: translateY(0); }
    .cta-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    /* ========== ORDER MODAL ========== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; visibility: hidden;
      transition: opacity var(--transition), visibility var(--transition);
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      width: 100%; max-width: 480px;
      transform: translateY(20px) scale(.97);
      transition: transform var(--transition);
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 32px;
    }
    .modal-title { font-size: 1.4rem; font-weight: 800; }
    .close-btn {
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); width: 36px; height: 36px;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      transition: color var(--transition), border-color var(--transition);
    }
    .close-btn:hover { color: var(--text); border-color: var(--muted); }

    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .form-label { font-size: .85rem; font-weight: 600; color: var(--muted); }
    .form-input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: .95rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      width: 100%;
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(240,165,0,.12);
    }
    .form-input::placeholder { color: var(--muted); }

    .submit-btn {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000; font-family: 'Cairo', sans-serif;
      font-size: 1rem; font-weight: 800;
      border: none; border-radius: 12px;
      cursor: pointer; margin-top: 8px;
      transition: opacity var(--transition), transform var(--transition);
    }
    .submit-btn:hover { opacity: .9; transform: translateY(-1px); }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ========== SUCCESS / ERROR TOAST ========== */
    .toast {
      position: fixed; bottom: 32px; left: 50%; z-index: 200;
      transform: translateX(-50%) translateY(80px);
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 24px;
      font-size: .9rem; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
      transition: transform .4s cubic-bezier(.4,0,.2,1);
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: #22c55e; color: #22c55e; }
    .toast.error   { border-color: #ef4444; color: #ef4444; }

    /* ========== FADE IN ANIMATION ========== */
    .fade-in {
      opacity: 0; transform: translateY(24px);
      animation: fadeUp .6s forwards;
    }
    @keyframes fadeUp {
      to { opacity:1; transform: translateY(0); }
    }
    .delay-1 { animation-delay: .1s; }
    .delay-2 { animation-delay: .2s; }
    .delay-3 { animation-delay: .3s; }
    .delay-4 { animation-delay: .4s; }
    .delay-5 { animation-delay: .5s; }

    /* ========== ERROR STATE ========== */
    .error-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 60vh; gap: 16px; text-align: center; padding: 40px;
    }
    .error-icon { font-size: 3rem; }
    .error-title { font-size: 1.4rem; font-weight: 800; }
    .error-msg { color: var(--muted); max-width: 400px; line-height: 1.7; }
    .error-hint {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 24px;
      font-size: .82rem; color: var(--muted);
      font-family: monospace; direction: ltr; text-align: left;
    }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-ring"></div>
  <span class="loader-text">جاري تحميل المنتج...</span>
</div>

<!-- WRAPPER -->
<div class="wrapper" id="app" style="display:none">

  <!-- HEADER -->
  <header>
    <div class="logo">🛍️ متجري</div>
    <div class="nav-badge">⚡ شحن سريع</div>
  </header>

  <!-- MAIN CONTENT injected by JS -->
  <main id="main"></main>

</div>

<!-- ORDER MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📦 تأكيد الطلب</div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">الاسم الكامل *</label>
      <input type="text" class="form-input" id="inputName" placeholder="اكتب اسمك هنا" />
    </div>
    <div class="form-group">
      <label class="form-label">رقم الهاتف *</label>
      <input type="tel" class="form-input" id="inputPhone" placeholder="01xxxxxxxxx" />
    </div>
    <div class="form-group">
      <label class="form-label">العنوان</label>
      <input type="text" class="form-input" id="inputAddress" placeholder="المدينة / الحي (اختياري)" />
    </div>
    <button class="submit-btn" id="submitBtn" onclick="submitOrder()">
      ✅ تأكيد الطلب الآن
    </button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  /* ============================================================
     🔧 CONFIG — بدّل الـ API LINK بتاعتك هنا
     ============================================================ */
  const API_URL = "https://script.google.com/macros/s/AKfycby8M71hW_mgydFwzc40-xUUGahzUjKz6t_Mm3Juck_fzC6PjkzwX4D49k7mmn0tMiqQ/exec";
  /* ============================================================ */

  let currentProduct = null;

  /* ---------- FETCH PRODUCT ---------- */
  async function loadProduct() {
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();

      /* الـ API بترجع array of arrays — السطر الأول headers، الثاني المنتج */
      /* لو عندك أكتر من منتج، غيّر [1] للـ index المناسب */
      const row = raw[1];
      currentProduct = {
        id:    row[0],
        name:  row[1],
        price: row[2],
        image: row[3],
        desc:  row[4],
        badge: row[5] || "متاح الآن",      /* column F — اختياري */
        cat:   row[6] || "منتج مميز",       /* column G — اختياري */
      };

      renderProduct(currentProduct);

    } catch (err) {
      renderError(err.message);
    } finally {
      hideLoader();
    }
  }

  /* ---------- RENDER PRODUCT ---------- */
  function renderProduct(p) {
    document.getElementById("main").innerHTML = `
      <section class="hero">

        <!-- IMAGE -->
        <div class="image-side fade-in delay-1">
          <div class="image-frame">
            <img id="productImage" src="${p.image}" alt="${p.name}"
                 onerror="this.src='https://via.placeholder.com/600x600/1c1c22/f0a500?text=No+Image'">
            <div class="badge-float">${p.badge}</div>
            <div class="rating-float">
              <span class="stars">★★★★★</span>
              <span>4.9</span>
            </div>
          </div>
        </div>

        <!-- INFO -->
        <div class="info-side">
          <div class="fade-in delay-1">
            <span class="category-tag">${p.cat}</span>
          </div>
          <h1 id="productName" class="fade-in delay-2">${p.name}</h1>
          <p id="productDesc" class="fade-in delay-3">${p.desc}</p>

          <div class="price-block fade-in delay-3">
            <span id="productPrice">${Number(p.price).toLocaleString()}</span>
            <span class="price-currency">جنيه</span>
            <span class="price-note">شامل الضريبة</span>
          </div>

          <div class="features-grid fade-in delay-4">
            <div class="feature-item"><span class="feature-icon">🚀</span> شحن سريع</div>
            <div class="feature-item"><span class="feature-icon">🔄</span> إرجاع مجاني</div>
            <div class="feature-item"><span class="feature-icon">🔒</span> دفع آمن</div>
            <div class="feature-item"><span class="feature-icon">💯</span> ضمان الجودة</div>
          </div>

          <button class="cta-btn fade-in delay-5" onclick="openModal()">
            🛒 اطلب الآن
          </button>
        </div>

      </section>
    `;
    document.getElementById("app").style.display = "block";
  }

  /* ---------- RENDER ERROR ---------- */
  function renderError(msg) {
    document.getElementById("main").innerHTML = `
      <div class="error-state">
        <div class="error-icon">⚠️</div>
        <div class="error-title">تعذّر تحميل المنتج</div>
        <div class="error-msg">
          تأكد إنك وضعت رابط الـ API الصح داخل الكود في المتغير <strong>API_URL</strong>
        </div>
        <div class="error-hint">const API_URL = "YOUR_APPS_SCRIPT_API_URL_HERE";</div>
        <div class="error-msg" style="font-size:.82rem">تفاصيل الخطأ: ${msg}</div>
      </div>
    `;
    document.getElementById("app").style.display = "block";
  }

  /* ---------- LOADER ---------- */
  function hideLoader() {
    const l = document.getElementById("loader");
    l.classList.add("hidden");
    setTimeout(() => l.remove(), 600);
  }

  /* ---------- MODAL ---------- */
  function openModal()  { document.getElementById("modalOverlay").classList.add("open"); }
  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("open");
    document.getElementById("inputName").value    = "";
    document.getElementById("inputPhone").value   = "";
    document.getElementById("inputAddress").value = "";
  }
  document.getElementById("modalOverlay").addEventListener("click", function(e){
    if (e.target === this) closeModal();
  });

  /* ---------- SUBMIT ORDER ---------- */
  async function submitOrder() {
    const name    = document.getElementById("inputName").value.trim();
    const phone   = document.getElementById("inputPhone").value.trim();
    const address = document.getElementById("inputAddress").value.trim();

    if (!name)  return showToast("❌ من فضلك ادخل الاسم", "error");
    if (!phone) return showToast("❌ من فضلك ادخل رقم الهاتف", "error");
    if (!/^01[0-2,5][0-9]{8}$/.test(phone))
      return showToast("❌ رقم الهاتف غير صحيح", "error");

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "⏳ جاري الإرسال...";

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",          /* مطلوب مع Apps Script */
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name,
          phone,
          address,
          product: currentProduct?.name || "",
          price:   currentProduct?.price || "",
        })
      });

      closeModal();
      showToast("✅ تم إرسال طلبك بنجاح! سنتواصل معك قريباً", "success");

    } catch (err) {
      showToast("❌ حدث خطأ، حاول مرة أخرى", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "✅ تأكيد الطلب الآن";
    }
  }

  /* ---------- TOAST ---------- */
  function showToast(msg, type = "success") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove("show"), 4000);
  }

  /* ---------- BOOT ---------- */
  loadProduct();
</script>
</body>
</html>
